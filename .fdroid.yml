# 上架文案以 fastlane/metadata/android/ 为准（F-Droid 优先读 fastlane，本文件
# 里的 Summary/Description 只在 fastlane 缺该语言时兜底）。改文案请两边同步，
# 别在这里单独演化出一份来。
Summary: One-tap LAN file sharing — the other device only needs a browser
Description: |-
  FileInfra is a Dufs-based, lightweight cross-platform file distribution
  GUI optimized for air-gapped LANs and restricted industrial environments.
  Install it on ONE device, tap start, and anyone on the same network can
  upload and download files via browser — no app needed on the other side.

  Features:

  * One-tap file sharing via HTTP
  * Upload files from any browser
  * QR code for easy access
  * File transfer log
  * Customizable permissions (read-only, upload, full)
  * Multi-language support (English, 简体中文, 繁體中文)
  * Material 3 design
  * Shared LAN clipboard and offline QR tools page
  * Android notification and Quick Settings start/stop controls

  Files and shared clipboard text go directly to the peers you connect to.
  No analytics or cloud relay is used. HTTP content is unencrypted, and the
  separate tools page is not protected by the file-server password.

RepoType: git
Repo: https://github.com/zocs/fileinfra

Builds:
  # 旧配方从 0.5.5 开始记录；历史不回填。完整 F-Droid builder 与可复现
  # 签名流程尚未验证，GitHub 构建通过不能代替这两项。
  - versionName: 0.5.13
    versionCode: 58
    # Preparation candidate; repin to the next tested release before submission.
    commit: 7223d39015ffa8d4406e701d0d85880615fb539c  # = tag v0.5.12 release commit
    sudo:
      - apt-get update
      # Native compilation needs a C toolchain. The 0.47 fork uses ring;
      # CMake is retained for the wider native/Flutter build environment.
      - apt-get install -y cmake build-essential
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      # 与 .github/workflows/build.yml 的 FLUTTER_VERSION 保持一致：F-Droid
      # 构建用的版本必须和 CI 验证过的是同一个，否则等于拿未测过的工具链出包
      # （handoff 里「本地 Flutter ≠ CI」踩过好几次）。
      - flutter@3.47.0
    prebuild:
      # 与 CI 显式固定的 RUST_VERSION 对齐。
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain
        1.99.1 --profile minimal --no-modify-path
      - source "$HOME/.cargo/env"
      # 三个 ABI 都要：`flutter build apk` 出的是 universal APK，缺哪个 ABI
      # 的 libdufs.so，那个 ABI 的设备装上就是一句「dufs 服务组件缺失」。
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - export ANDROID_NDK_HOME="$$NDK$$"
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - bash scripts/build_dufs.sh android-arm64
      - bash scripts/build_dufs.sh android-arm
      - bash scripts/build_dufs.sh android-x86_64
    scanignore:
      # libdufs.so / assets/dufs/* 都是 prebuild 阶段从源码编出来的，仓库里
      # 不含任何预编译二进制（.gitignore 已挡），这里只是让扫描器别把构建
      # 中间产物当成预编译件。
      - android/app/src/main/jniLibs
      - assets/dufs
      - .pub-cache
    build:
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - export FILEINFRA_UNSIGNED_RELEASE=1
      - $$flutter$$/bin/flutter build apk --release
    # 与 CI 的 EXPECTED_NDK_MAJOR 一致。注意：真正保证老设备能加载的是
    # scripts/build_dufs.sh 里强制的 -Wl,-z,max-page-size=0x1000 +
    # --pack-dyn-relocs=none，CI 的 page-alignment guard 会校验；NDK 版本本身
    # 换大版本时需重新编译/检查三个 ABI，并另外记录设备兼容验证。
    ndk: r29

# Default F-Droid signing uses a different certificate from GitHub APKs.
# Developer-signature continuity requires reproducible upstream Binaries,
# not merely the public AllowedAPKSigningKeys fingerprint.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: 'pubspec.yaml|version:\s+[^\s+]+\+(\d+)|.|version:\s+([^\s+]+)\+'
