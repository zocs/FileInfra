name: Build & Release

# 每次 CI 运行时带备注（run-name 显示在 Actions 列表里，便于区分用途）：
# - 手动触发：gh workflow run build.yml -f note="<备注>"
# - tag 触发：自动带版本号（如 v0.5.7 → “Build & Release · v0.5.7”）。
run-name: "Build & Release · ${{ github.event.inputs.note || github.ref_name || 'manual' }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      note:
        description: 'This build''s purpose (shows in Actions list)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.0'
  RUST_VERSION: '1.99.1'
  # Preserve the signing certificate used by existing FileInfra installations.
  ANDROID_RELEASE_CERT_SHA256: 'e4db9054ff7070e4bee3387e928e1388facfec0526da10e4510282e9d26aed6a'
  # Bump after verifying ABI compat (esp. page-alignment on devices < API 35).
  # 28→29 (2026-08-18): runner ships NDK 29; libdufs alignment is still
  # force-pinned to 4KB by build_dufs.sh and verified by the hard guard below,
  # so the <API 35 page-size concern is covered independently of NDK default.
  EXPECTED_NDK_MAJOR: '29'
  # Android dynamic linker on devices < API 35 mishandles 16KB-aligned LOAD
  # segments. scripts/build_dufs.sh android-arm64 forces 0x1000 via
  # -Wl,-z,max-page-size=0x1000; this guard catches drift.
  ANDROID_LIBDUFS_ALIGN: '0x1000'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Analyze & regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake binutils rpm
          python3 -m pip install PyYAML
          npm ci --prefix test/browser
          CHROMIUM=$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)
          test -n "$CHROMIUM"
          echo "FILEINFRA_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - name: Flutter and real browser regressions
        run: flutter test --no-pub --reporter expanded
      - name: Build and packaging regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p '*_test.py' -v
          python3 -m unittest discover -s test -p '*_test.py' -v
          python3 scripts/fdroid_prep_check.py

  build-android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_AVAILABLE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        shell: bash
        run: echo "VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')" >> $GITHUB_ENV
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-android-${{ hashFiles('scripts/build_dufs.sh') }}
          restore-keys: |
            cargo-android-
            cargo-aarch64-linux-android-
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - run: flutter pub get
      - name: Initialize Android Gradle wrapper
        # Flutter generates the ignored wrapper scripts/JAR in a fresh checkout.
        run: flutter build apk --debug --config-only --no-pub
      - name: Android notification and activity regressions
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Resolve and check NDK version
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -type d -name '[0-9]*' | sort -V | tail -1)
          NDK_VERSION=$(basename "$NDK_DIR")
          echo "NDK found: $NDK_VERSION at $NDK_DIR"
          NDK_MAJOR=${NDK_VERSION%%.*}
          if [ "$NDK_MAJOR" != "${{ env.EXPECTED_NDK_MAJOR }}" ]; then
            echo "::warning::NDK major $NDK_MAJOR (got $NDK_VERSION) differs from expected ${{ env.EXPECTED_NDK_MAJOR }}. Bump EXPECTED_NDK_MAJOR after confirming ABI compat (especially page alignment on devices < API 35)."
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
      - name: Compile dufs from source
        # 三个 ABI 都要编：`flutter build apk` 出的是 universal APK，里面
        # 包含 armeabi-v7a / arm64-v8a / x86_64 三套 libapp.so+libflutter.so，
        # 但 libdufs.so 只在我们编了的那个 ABI 下存在。缺 ABI 的设备上应用
        # 装得上、界面也跑，一点启动就是「dufs 服务组件缺失」——而
        # F-Droid 的用户机队恰好偏旧、偏 32 位。
        run: |
          bash scripts/build_dufs.sh android-arm64
          bash scripts/build_dufs.sh android-arm
          bash scripts/build_dufs.sh android-x86_64
      - name: Verify libdufs.so page alignment
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SO=android/app/src/main/jniLibs/$ABI/libdufs.so
            if [ ! -f "$SO" ]; then
              echo "::error::missing $SO — devices on $ABI will install but fail to start the server."
              exit 1
            fi
            BAD=$(readelf -lW "$SO" | awk '/^  LOAD/ {print $NF}' | sort -u | grep -vxE "${{ env.ANDROID_LIBDUFS_ALIGN }}" || true)
            if [ -n "$BAD" ]; then
              echo "::error::$SO LOAD alignment != ${{ env.ANDROID_LIBDUFS_ALIGN }}: got $BAD"
              echo "::error::Older Android (< API 35) dynamic linker mishandles 16KB-aligned binaries -> dufs binds but networking syscalls misbehave."
              echo "::error::Check scripts/build_dufs.sh android-* has -Wl,-z,max-page-size=${{ env.ANDROID_LIBDUFS_ALIGN }}."
              exit 1
            fi
            echo "OK: $SO aligned to ${{ env.ANDROID_LIBDUFS_ALIGN }} ($(du -h "$SO" | cut -f1))"
          done
      - name: Check dufs web assets JS syntax (Chromium>=55)
        # 白屏修复防回归（陷阱 #14）：index.js 编译进 libdufs.so，禁止
        # Chromium>=80 语法（?. / Object.fromEntries / catch{} / 对象展开）
        # 回到 Android 核心。
        run: |
          DUFS_REF=$(sed -n 's/^DUFS_VERSION="\([^"]*\)"/\1/p' scripts/build_dufs.sh)
          SRC="${TMPDIR:-/tmp}/dufs-src-${DUFS_REF}"
          if [ ! -f "$SRC/assets/index.js" ]; then
            echo "::error::pinned dufs checkout not found: $SRC"
            exit 1
          fi
          bash scripts/check_dufs_web.sh "$SRC/assets/index.js"
      - name: Verify unsigned F-Droid build path
        run: |
          env -u KEYSTORE_FILE -u KEYSTORE_PASSWORD -u KEY_ALIAS -u KEY_PASSWORD \
            FILEINFRA_UNSIGNED_RELEASE=1 flutter build apk --release
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify build/app/outputs/flutter-apk/app-release.apk; then
            echo "::error::F-Droid opt-in unexpectedly produced a signed APK"
            exit 1
          fi
      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/fileinfra-release.jks
          echo "KEYSTORE_FILE=/tmp/fileinfra-release.jks" >> $GITHUB_ENV
          if [ -n "$KEY_ALIAS" ]; then echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"; fi
      - name: Require keystore for tag-triggered release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_FILE == ''
        run: |
          echo "::error::Release tag ${{ github.ref_name }} pushed but KEYSTORE_BASE64 secret is missing."
          echo "::error::Refusing to build a debug-signed APK to the release channel."
          exit 1
      - name: Build universal APK
        env:
          FILEINFRA_UNSIGNED_RELEASE: ${{ env.ANDROID_KEYSTORE_AVAILABLE == 'true' && '0' || '1' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Build per-ABI APKs
        env:
          FILEINFRA_UNSIGNED_RELEASE: ${{ env.ANDROID_KEYSTORE_AVAILABLE == 'true' && '0' || '1' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        # universal（三个 ABI 合一）+ 分架构包；文件名别再写 arm64 误导用户。
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk fileinfra-${{ env.VERSION }}-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk fileinfra-${{ env.VERSION }}-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk fileinfra-${{ env.VERSION }}-android-armv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk fileinfra-${{ env.VERSION }}-android-x86_64.apk
      - name: Verify release signing continuity
        if: env.ANDROID_KEYSTORE_AVAILABLE == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for APK in fileinfra-*-android-*.apk; do
            CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$CERT" != "$ANDROID_RELEASE_CERT_SHA256" ]; then
              echo "::error::$APK does not use the existing FileInfra signing certificate"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            fileinfra-${{ env.VERSION }}-android-*.apk

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        shell: bash
        run: echo "VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-x86_64-pc-windows-msvc-${{ hashFiles('scripts/build_dufs.sh') }}
          restore-keys: |
            cargo-x86_64-pc-windows-msvc-
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - name: Compile dufs from source
        run: bash scripts/build_dufs.sh windows-x86_64
        shell: bash
      - run: flutter build windows --release
      - name: Copy dufs DLL to build output
        shell: bash
        run: cp "${{ github.workspace }}/assets/dufs/dufs-windows-x86_64.dll" build/windows/x64/runner/Release/dufs.dll
      - name: Create zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath fileinfra-${{ env.VERSION }}-windows-x64.zip
      - name: Verify packaged Windows startup and native FFI
        run: ./scripts/verify_windows_bundle.ps1 fileinfra-${{ env.VERSION }}-windows-x64.zip
      - name: Install NSIS
        run: |
          # choco exits 0 even when the community feed 503s and it installs
          # 0/0 packages (bit v0.5.0's first release run) — verify the binary
          # actually landed and retry before trusting it.
          $exe = "C:\Program Files (x86)\NSIS\makensis.exe"
          foreach ($i in 1..3) {
            choco install nsis -y
            if (Test-Path $exe) { break }
            Write-Host "NSIS not present after attempt $i; retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          if (-not (Test-Path $exe)) { Write-Error "NSIS install failed after 3 attempts"; exit 1 }
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build NSIS installer
        run: makensis /DAPP_VERSION=${{ env.VERSION }} installer\fileinfra.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            fileinfra-${{ env.VERSION }}-windows-x64.zip
            fileinfra-${{ env.VERSION }}-windows-x64-setup.exe

  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/build_dufs.sh') }}
          restore-keys: |
            cargo-x86_64-unknown-linux-gnu-
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev dpkg-dev libfuse2 cmake ninja-build clang lld llvm libayatana-appindicator3-dev libsecret-1-dev
      - name: Build and package
        run: bash scripts/build_linux.sh x86_64
      - name: Verify packaged native FFI
        run: python3 scripts/verify_dufs_ffi.py build/linux/output/fileinfra/libdufs.so
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: build/linux/output/*

  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter manually
        run: |
          # No silent stable fallback: a silently different toolchain would
          # ship an ARM64 artifact built unlike every other platform.
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git "$HOME/flutter"
          export PATH="$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin:$PATH"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          flutter precache --linux
          flutter config --no-analytics
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-aarch64-unknown-linux-gnu-${{ hashFiles('scripts/build_dufs.sh') }}
          restore-keys: |
            cargo-aarch64-unknown-linux-gnu-
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-gnu
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev dpkg-dev libfuse2 cmake ninja-build clang lld llvm libayatana-appindicator3-dev libsecret-1-dev
      - name: Build and package
        run: |
          export PATH="$HOME/flutter/bin:$HOME/flutter/bin/cache/dart-sdk/bin:$PATH"
          bash scripts/build_linux.sh aarch64
      - name: Verify packaged native FFI
        run: python3 scripts/verify_dufs_ffi.py build/linux/output/fileinfra/libdufs.so
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: build/linux/output/*

  build-linux-compat:
    name: Linux x64 (compat, glibc 2.27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build compat Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/linux-compat.Dockerfile
          build-args: |
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
            RUST_VERSION=${{ env.RUST_VERSION }}
          load: true
          tags: fileinfra-compat:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create output directory
        run: mkdir -p /tmp/compat-out
      - name: Build inside container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v /tmp/compat-out:/out \
            -e FILEINFRA_OUTPUT_DIR=/out \
            -e FILEINFRA_ARCHIVE_SUFFIX=-compat \
            -e DUFS_NO_DEFAULT_FEATURES=1 \
            fileinfra-compat:latest \
            bash -ec 'cd /src
              bash scripts/build_linux.sh x86_64
              python3 scripts/verify_dufs_ffi.py /out/fileinfra/libdufs.so'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-compat
          path: /tmp/compat-out/*

  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-aarch64-apple-darwin-${{ hashFiles('scripts/build_dufs.sh') }}
          restore-keys: |
            cargo-aarch64-apple-darwin-
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin
      - name: Build and package
        run: bash scripts/build_macos.sh aarch64
      - name: Verify macOS ARM64 native FFI
        run: python3 scripts/verify_dufs_ffi.py build/macos/output/FileInfra.app/Contents/MacOS/libdufs.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          # zip only: the staged FileInfra.app next to it is the same bundle
          # unpacked (thousands of files) and the release never uses it.
          path: build/macos/output/*.zip

  build-macos-x64:
    name: macOS x64 (Intel)
    # Same Apple Silicon runner as arm64: `flutter build macos --release` is
    # already universal (arm64 + x86_64), and dufs cross-compiles to
    # x86_64-apple-darwin with the stock toolchain (upstream dufs builds its
    # own x86_64-apple-darwin release on macos-latest the same way). No Intel
    # runner needed. build_macos.sh fails the job if any Mach-O in the bundle
    # lacks an x86_64 slice.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-x86_64-apple-darwin-${{ hashFiles('scripts/build_dufs.sh') }}
          restore-keys: |
            cargo-x86_64-apple-darwin-
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin
      - name: Build and package
        run: bash scripts/build_macos.sh x86_64
      - name: Verify macOS Intel native FFI under Rosetta
        run: arch -x86_64 /usr/bin/python3 scripts/verify_dufs_ffi.py build/macos/output/FileInfra.app/Contents/MacOS/libdufs.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          path: build/macos/output/*.zip

  build-ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-aarch64-apple-ios-${{ hashFiles('scripts/build_dufs.sh') }}
          restore-keys: |
            cargo-aarch64-apple-ios-
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
      - name: Compile dufs from source
        run: bash scripts/build_dufs.sh ios-arm64
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign
          install -m 755 ios/Frameworks/dufs build/ios/iphoneos/Runner.app/dufs
          test -x build/ios/iphoneos/Runner.app/dufs
          mkdir -p build/ios/output
          APP_NAME="FileInfra"
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | awk -F'+' '{print $1}')
          cp -r build/ios/iphoneos/Runner.app "build/ios/output/${APP_NAME}-${VERSION}-ios-arm64.app"
          cd build/ios/output && zip -r -y "${APP_NAME}-${VERSION}-ios-arm64.zip" "${APP_NAME}-${VERSION}-ios-arm64.app"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: build/ios/output/*.zip

  release:
    name: Release
    needs: [lint, build-android, build-windows, build-linux-x64, build-linux-arm64, build-linux-compat, build-macos-arm64, build-macos-x64, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # checkout first: it cleans the workspace, so it must run before the
      # artifacts are downloaded. Needed for CHANGELOG.md + the release footer.
      - uses: actions/checkout@v7
      # 只下载构建产物，显式排除 Docker Buildx 的 cache artifact
      #（zocs~FileInfra~*.dockerbuild）：它是 cache 服务不可用时 buildx
      # 上传的原始 gzip（非 zip 容器），download-artifact 解压必失败，
      # 连续三个版本（v0.5.7/0.5.8/0.5.9）的 Release job 都因此挂掉。
      # pattern 用花括号展开精确枚举（v8 的 pattern 是单 glob，多行
      # YAML 会被当成含换行的单字符串导致 0 匹配，2026-09-03 踩过）。
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{android,windows,ios,macos-arm64,macos-x64,linux-x64,linux-x64-compat,linux-arm64}"
      - name: List artifacts
        run: find artifacts -type f
      - name: Build release notes
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          # Prefer concise public notes; CHANGELOG retains technical details.
          ver="$VERSION_TAG"
          {
            if [ -f ".github/release_notes/$ver.md" ]; then
              cat ".github/release_notes/$ver.md"
            else
              awk -v ver="$ver" '
                index($0, "## [" ver "]")==1 {cap=1; next}
                cap && (/^## \[/ || /^---[[:space:]]*$/) {exit}
                cap {print}
              ' CHANGELOG.md | sed -e '/./,$!d'
            fi
            echo
            cat .github/release_body_footer.md
          } > release_body.md
          echo "----- release_body.md -----"
          cat release_body.md
      - name: Generate checksums
        run: |
          python3 scripts/release_checksums.py artifacts
          cat artifacts/checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          files: |
            artifacts/checksums.txt
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
            artifacts/**/*-windows-x64.zip
            artifacts/**/*-macos-arm64.zip
            artifacts/**/*-macos-x64.zip
            artifacts/**/*-ios-arm64.zip
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
